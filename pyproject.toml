[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-devtools-server"
version = "0.1.0"
description = "A Model Context Protocol server exposing guarded developer tools: git, docker, read-only Postgres, HTTP probes and log search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Georghiou" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "developer-tools", "git", "docker", "postgres"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[project.scripts]
mcp-devtools = "mcp_devtools.cli:app"

[project.urls]
Repository = "https://github.com/alexgeorghiou/mcp-devtools-server"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_devtools"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = [
  "S603", # subprocess without shell is the point of the git/docker backends
  "S607", # git/docker resolved from PATH by design
  "N818", # PermissionDenied / ToolDisabled read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcp_devtools"]
mypy_path = "src"
warn_unused_ignores = false

