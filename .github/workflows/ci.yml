name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library_owner
          POSTGRES_PASSWORD: owner-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library_owner -d library"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MCP_DEVTOOLS_TEST_PG_DSN: postgresql://devtools_reader:reader@localhost:5432/library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Load sample database
        env:
          PGPASSWORD: owner-password
        run: psql -h localhost -U library_owner -d library -v ON_ERROR_STOP=1 -f examples/compose/initdb/01-library.sql
      - run: pip install -e ".[dev]"
      - run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-devtools-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm mcp-devtools-server:ci version
          docker run --rm mcp-devtools-server:ci validate-sql "SELECT 1"
